name: XArch CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-and-test:
    name: XArch Build, Test, and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout XArch Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Cache pnpm Dependencies
        uses: pnpm/action-setup@v3
        with:
          version: 10.14.0
          run_install: true
          pnpm-cache: true
          
      - name: Run ESLint Check
        run: pnpm run lint

      - name: Check Code Formatting (Prettier)
        run: pnpm prettier --check "src/**/*.ts"

      - name: Build TypeScript (TSC)
        run: pnpm build

      - name: Run Unit Tests (Jest)
        run: pnpm test
        
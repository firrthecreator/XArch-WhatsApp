name: XArch CI Pipeline

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch:

jobs:
  build-and-test:
    name: XArch Build, Test, and Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout XArch Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Cairo Dev)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Cache pnpm Dependencies
        uses: pnpm/action-setup@v3
        with:
          version: 10.14.0
          run_install: true
          pnpm-cache: true

      - name: Check Code Formatting (Prettier)
        run: pnpm prettier --check "src/**/*.ts"

      - name: Build TypeScript (TSC)
        run: pnpm build

      - name: Run Unit Tests (Jest)
        run: pnpm test
